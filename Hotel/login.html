<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Webpage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0; 
            padding: 0;
            background: #f5f5f5;
        }
        header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }
        main {
            margin-top: 20px;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            color: #666;
        }
        .header {
            margin: 0;
            padding: 0;
            position: relative;
            height: 250px;
            background-image: url('images/3.png');
            background-size: cover;
            background-position: center;
            text-align: center;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .overlay-img {
            position: absolute;
            top: 47%;
            left: 35%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: auto;
        }
        .header-title {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
        }
        .login-title {
            font-family: 'Georgia', serif;
            font-size: 28px;
            color: #333;
            text-align: center;
            margin-bottom: 15px;
        }
        .login-btn {
            width: 120px;
            padding: 8px 12px;
            margin-top: 10px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #9f8681;
            color: white;
            display: block;
            margin-left: auto;
            margin-right: auto;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .login-btn:hover {
            background-color: transparent;
            color: #9f8681;
            border: 2px solid #9f8681;
            transform: scale(1.05);
        }
       
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
        }

       
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #ffffff;
            border-top: 6px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="header-title">PRISTINE HOTEL</h1>
        <img src="images/whiteLogo.png" class="overlay-img" alt="Overlay Image">
    </header>
    <main>
        <h2 class="login-title">Login</h2>
        <form action="#" method="post" style="max-width:300px;margin:auto;">
            <label for="username">Username</label><br>
            <input type="text" id="username" name="username" required style="width:100%;padding:8px;margin:8px 0;" />
            <br>
            <label for="password">Password</label><br>
            <input type="password" id="password" name="password" required style="width:100%;padding:8px;margin:8px 0;" />
            <br>
            <button class="login-btn">Log In</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 My Website</p>
    </footer>
<script>
        document.querySelector('.login-btn').addEventListener('click', function(event) {
            event.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const validUser = "admin";
            const validPass = "1234";

           
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';

            setTimeout(() => {
                loader.style.display = 'none';

                if (user === validUser && pass === validPass) {
                    window.location.href = "hi.html";
                } else {
                    alert("Invalid username or password.");
                }
            }, 1500);
        });
    </script>
<div id="loader">
        <div class="spinner"></div>
    </div>
</body>
</html>
